name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NNRP_JS_RUST_ARTIFACT_VERSION: 1.0.0-preview.4.22
  NNRP_JS_RUST_ARTIFACT_RUN_ID: "31666415612"
  NNRP_JS_RUST_ARTIFACT_COMMIT: 295f5b65ac71885b5c1b54d927b2595005038481
  NNRP_DOC_SOURCE_COMMIT: 3439ded0d318bd736f6485b17f2563fae77627bf
  NNRP_CONFORMANCE_SOURCE_COMMIT: 0ae3bd5d8ecaa387822888868e8676f0a3596bcd

jobs:
  content-policy:
    name: content-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject prohibited vendor/model references
        id: content_policy
        shell: bash
        run: |
          set +e
          first_term="Anthro""pic"
          second_term="Clau""de"
          output="$(
            set -euo pipefail
            violations=0
            for term in "$first_term" "$second_term"; do
              matches="$(git grep -n -I -i -F -- "$term" -- . || true)"
              if [ -n "$matches" ]; then
                echo "Tracked file content contains prohibited keyword: $term"
                echo "$matches"
                violations=1
              fi
            done

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              messages="$(git log --format=%B "$base..$head")"
            else
              messages="$(git log --format=%B -n 1 "$head")"
            fi

            for term in "$first_term" "$second_term"; do
              if grep -qiF -- "$term" <<< "$messages"; then
                echo "Commit message contains prohibited keyword: $term"
                violations=1
              fi
            done

            exit "$violations"
          )"
          status="$?"
          {
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit "$status"
      - name: Close prohibited-content PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_OUTPUT: ${{ steps.content_policy.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This PR was closed automatically because it violates the repository content policy."
            echo
            echo "Prohibited vendor/model references are not accepted in code or commit messages."
            echo
            echo '```text'
            printf '%s\n' "$POLICY_OUTPUT"
            echo '```'
          } > content-policy-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file content-policy-comment.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect docs-only changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          if [[ -n "$changed" ]] && ! grep -Ev '^(README\.md|CONTRIBUTING\.md|LICENSE|doc/|docs/|assets/.*\.(svg|png|jpg|jpeg|webp))$' <<< "$changed" >/dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  commit-policy:
    name: commit-policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce conventional commit and single-commit PRs
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          head_ref="${{ github.head_ref }}"
          range="origin/$base_ref..HEAD"
          count="$(git rev-list --count "$range")"
          if [[ "$base_ref" == "main" && "$head_ref" == "develop" ]]; then
            echo "Develop-to-main integration PR detected; preserving reviewed integration history is allowed."
            exit 0
          fi
          if [[ "$count" -ne 1 ]]; then
            echo "PR must contain exactly one commit before review; found $count."
            exit 1
          fi
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^(feat|fix|docs|chore|test|refactor|perf|ci|build)(\([a-z0-9._-]+\))?:\ .+ ]]; then
              echo "Commit subject is not Conventional Commits style: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$range")

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout frozen SDK contract
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-doc
          ref: ${{ env.NNRP_DOC_SOURCE_COMMIT }}
          path: .docs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: deno task format:check
      - name: Content policy
        run: deno task content-policy
      - name: Lint
        run: deno lint
      - name: Preview4 todo contract
        run: deno task todo:check
      - name: Public API consistency
        env:
          NNRP_DOC_ROOT: ${{ github.workspace }}/.docs
        run: deno task api-consistency
      - name: Prepare Rust artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Typecheck
        run: deno task typecheck
      - name: Test
        # The Deno-hosted browser/WASM role test co-locates its native server in
        # this process. Keep that synthetic gate on one Deno Tokio worker; the
        # real-browser wire job below still exercises the default runtime.
        env:
          TOKIO_WORKER_THREADS: "1"
        run: deno task test
      - name: Build
        run: deno task build
      - name: Coverage
        run: deno task coverage
      - name: Native runtime frame smoke
        run: deno task native-runtime-frame-smoke
      - name: Native transport loopback smoke
        run: deno task native-transport-smoke
      - name: Package entrypoint smoke
        run: deno task package-check
      - name: Installed package smoke
        run: deno task installed-package-smoke
      - name: SDK command smoke
        shell: bash
        run: |
          set -euo pipefail
          deno task manifest >/tmp/nnrp-js-manifest.json
          deno task conformance:backend >/tmp/nnrp-js-conformance-backend.json
          deno task conformance:browser >/tmp/nnrp-js-conformance-browser.json
          deno task benchmark:backend >/tmp/nnrp-js-benchmark-backend.json
          deno task benchmark:browser >/tmp/nnrp-js-benchmark-browser.json
          deno task benchmark:smoke

  runtime-policy:
    name: runtime-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reject unsupported runtime adapters
        id: runtime_policy
        shell: bash
        run: |
          set +e
          output="$(deno task runtime-policy 2>&1)"
          status="$?"
          {
            echo "status=$status"
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit "$status"
      - name: Close unsupported runtime PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_OUTPUT: ${{ steps.runtime_policy.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This PR was closed automatically because it violates the JS runtime policy."
            echo
            echo "Unsupported runtime/tooling/adaptation entries are not accepted in this repository."
            echo
            echo '```text'
            printf '%s\n' "$POLICY_OUTPUT"
            echo '```'
          } > runtime-policy-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file runtime-policy-comment.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  wire-conformance-native:
    name: wire-conformance-native
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
      - name: Checkout conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: .conformance
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust runner
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .conformance
      - name: Prepare Rust artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Run native wire conformance
        env:
          NNRP_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
        run: deno task wire-conformance:native
      - name: Upload wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nnrp-js-native-wire-conformance
          if-no-files-found: error
          path: |
            artifacts/wire-conformance/native/target.json
            artifacts/wire-conformance/native/plan.json
            artifacts/wire-conformance/native/results.json
            artifacts/wire-conformance/native/evidence

  wire-conformance-browser:
    name: wire-conformance-browser
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
      - name: Checkout conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: .conformance
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust runner
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .conformance
      - name: Prepare browser WASM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Run browser wire conformance
        env:
          NNRP_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
          NNRP_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: deno task wire-conformance:browser
      - name: Upload browser wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nnrp-js-browser-wire-conformance
          if-no-files-found: error
          path: |
            artifacts/wire-conformance/browser/target.json
            artifacts/wire-conformance/browser/plan.json
            artifacts/wire-conformance/browser/results.json
            artifacts/wire-conformance/browser/browser-results.json
            artifacts/wire-conformance/browser/browser-evidence.jsonl
            artifacts/wire-conformance/browser/browser-stdout.log
            artifacts/wire-conformance/browser/browser-stderr.log
            artifacts/wire-conformance/browser/evidence

  suite-conformance:
    name: suite-conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
      - name: Checkout conformance suite
        uses: actions/checkout@v5
        with:
          repository: NagareWorks/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: .conformance
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare Rust artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Run suite-owned Preview4 adapter conformance
        uses: ./.conformance/.github/actions/run-conformance
        with:
          protocol-version: nnrp-1-preview4
          capabilities-path: conformance/nnrp-1-preview4.capabilities.json
          require-complete-capability-coverage: "true"
          working-directory: .
          artifact-name: nnrp-js-preview4-conformance
          adapter-command: >-
            deno task conformance:suite
            --plan $env:NNRP_CONFORMANCE_ADAPTER_PLAN
            --output $env:NNRP_CONFORMANCE_ADAPTER_RESULTS

  native-carrier-matrix:
    name: native-carrier-${{ matrix.os }}-${{ matrix.transport }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        transport:
          - tcp
          - ipc
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare Rust artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Build Node packages
        if: matrix.transport == 'tcp'
        run: deno task build
      - name: Run Node native role E2E
        if: matrix.transport == 'tcp'
        run: deno task node-import-smoke
      - name: Run native carrier E2E
        run: >-
          deno task native-transport-smoke
          --transport ${{ matrix.transport }}
          --result artifacts/native-carrier-matrix/${{ runner.os }}-${{ runner.arch }}-${{ matrix.transport }}.json
      - name: Upload native carrier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nnrp-js-${{ runner.os }}-${{ runner.arch }}-${{ matrix.transport }}
          if-no-files-found: error
          path: artifacts/native-carrier-matrix/*.json

  native-node-windows-x86:
    name: native-node-windows-x86
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup x86 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x86
      - name: Prepare Rust artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task artifacts:prepare
      - name: Install x86 Koffi runtime
        shell: pwsh
        run: |
          npm install --prefix artifacts/koffi-x86 --no-save --package-lock=false --ignore-scripts @koromix/koffi-win32-ia32@3.1.1
          New-Item -ItemType Directory -Force node_modules/@koromix | Out-Null
          Copy-Item -Recurse -Force artifacts/koffi-x86/node_modules/@koromix/koffi-win32-ia32 node_modules/@koromix/
      - name: Build Node packages
        run: deno task build
      - name: Run x86 Node native role E2E
        run: deno task node-import-smoke

  docs-only:
    name: docs-only
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - name: Acknowledge docs-only change
        run: echo "Docs-only change; build-test skipped."

  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    needs:
      - content-policy
      - changes
      - build-test
      - docs-only
      - runtime-policy
      - wire-conformance-native
      - wire-conformance-browser
      - suite-conformance
      - native-carrier-matrix
      - native-node-windows-x86
    if: always()
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail
          content_policy="${{ needs.content-policy.result }}"
          build="${{ needs.build-test.result }}"
          docs="${{ needs.docs-only.result }}"
          runtime_policy="${{ needs.runtime-policy.result }}"
          wire_conformance="${{ needs.wire-conformance-native.result }}"
          browser_wire_conformance="${{ needs.wire-conformance-browser.result }}"
          suite_conformance="${{ needs.suite-conformance.result }}"
          native_carrier_matrix="${{ needs.native-carrier-matrix.result }}"
          native_node_windows_x86="${{ needs.native-node-windows-x86.result }}"
          if [[ "$content_policy" != "success" ]]; then
            echo "content-policy did not pass: $content_policy"
            exit 1
          fi
          if [[ "$runtime_policy" != "success" ]]; then
            echo "runtime-policy did not pass: $runtime_policy"
            exit 1
          fi
          if [[ "$wire_conformance" != "success" && "$docs" != "success" ]]; then
            echo "wire-conformance-native did not pass: $wire_conformance"
            exit 1
          fi
          if [[ "$browser_wire_conformance" != "success" && "$docs" != "success" ]]; then
            echo "wire-conformance-browser did not pass: $browser_wire_conformance"
            exit 1
          fi
          if [[ "$suite_conformance" != "success" && "$docs" != "success" ]]; then
            echo "suite-conformance did not pass: $suite_conformance"
            exit 1
          fi
          if [[ "$native_carrier_matrix" != "success" && "$docs" != "success" ]]; then
            echo "native-carrier-matrix did not pass: $native_carrier_matrix"
            exit 1
          fi
          if [[ "$native_node_windows_x86" != "success" && "$docs" != "success" ]]; then
            echo "native-node-windows-x86 did not pass: $native_node_windows_x86"
            exit 1
          fi
          if [[ "$build" == "success" || "$docs" == "success" ]]; then
            exit 0
          fi
          echo "Neither build-test nor docs-only succeeded."
          exit 1
